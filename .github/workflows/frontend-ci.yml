name: Frontend CI & Build Pipeline

on:
  push:
    branches:
      - frontend
      - 'feat/frontend-*'
      - 'fix/frontend-*'
  pull_request:
    branches:
      - frontend

jobs:
  build-and-lint-frontend:
    name: Build & Validate Frontend Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation & Production Build
        run: npm run build
