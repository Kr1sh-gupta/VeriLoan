version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./copilot.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/intain/data
      - backend_data:/intain/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  backend_data:
